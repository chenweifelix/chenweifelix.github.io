theme: hugo-theme-red-rose
baseURL: https://chenweifelix.github.io/
languageCode: en
title: Felix (Chen-Wei) Yu
PygmentsCodeFences: yes
PygmentsStyle: solarized-dark256
pluralizelisttitles: 'false'
pagination.pagerSize: 2
disableHugoGeneratorInject: yes
params:
  ava: /img/profile.JPG
  description: Personal website of Felix (Chen-Wei) Yu, a researcher studying emotion regulation and its individual, interpersonal, and societal consequences.
module:
  hugoVersion:
    extended: yes
    min: 0.55.0
publishDir: "docs"
ignoreFiles: ["\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
markup:
  goldmark:
    renderer:
      unsafe: true
