{{ define "main" }}
<main>
  <div{{ if .Params.toc }} class="page-with-toc"{{ end }}>
{{ if .Params.toc }}
    <aside class="page-toc" aria-label="Page navigation">
      <p class="page-toc-title">On this page</p>
      {{ .TableOfContents }}
    </aside>
{{ end }}
    <article class="page-article">
{{ with .Title }}
      <h1>{{ . }}</h1>
{{ end }}
      <div>
        {{ .Content }}
      </div>
{{ with .Params.tags }}
      <div>
        <ul class="tags">
{{ range . }}
          <a class="text-white" href="{{ "/tags/" | relURL }}{{ . | urlize }}">{{ . }}</a>
{{ end }}
        </ul>
      </div>
{{ end }}
    </article>
  </div>
</main>
{{ end }}
